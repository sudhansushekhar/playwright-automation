name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Browser project to run'
        type: choice
        options: [ all, chrome, safari ]
        default: chrome
      tag:
        description: 'Only run tests with this tag (e.g. @web, @API). Empty = all'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Configure under Settings → Secrets and variables → Actions
      BASE_URL: ${{ secrets.BASE_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_EMAIL: ${{ secrets.APP_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      TEST_ENV: ${{ vars.TEST_ENV || 'ci' }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # reporting-labs keeps run history (trend, flaky, new vs known failures) in this file
    - name: Restore reporting-labs history
      uses: actions/cache/restore@v4
      with:
        path: reporting-labs.history.json
        key: reporting-labs-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          reporting-labs-history-${{ github.ref_name }}-
          reporting-labs-history-

    - name: Run Playwright tests
      env:
        PROJECT: ${{ inputs.project || 'chrome' }}   # push / PR runs use Chrome
        TAG: ${{ inputs.tag }}
      run: |
        args=()
        if [ "$PROJECT" != "all" ]; then args+=("--project=$PROJECT"); fi
        if [ -n "$TAG" ]; then args+=("--grep" "$TAG"); fi
        npx playwright test "${args[@]}"

    - name: Save reporting-labs history
      if: ${{ !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: reporting-labs.history.json
        key: reporting-labs-history-${{ github.ref_name }}-${{ github.run_id }}

    - name: Write job summary
      if: ${{ !cancelled() }}
      run: node scripts/ci-summary.js >> "$GITHUB_STEP_SUMMARY"

    - name: Upload reporting-labs report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: reporting-labs-report
        path: reporting-labs/
        retention-days: 30

    - name: Upload traces and screenshots
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 7

    # Optional: publish the report to GitHub Pages.
    # Enable by setting repository variable PUBLISH_REPORT_TO_PAGES=true and Pages source = "GitHub Actions".
    - name: Upload report for GitHub Pages
      if: ${{ !cancelled() && vars.PUBLISH_REPORT_TO_PAGES == 'true' && github.event_name != 'pull_request' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: reporting-labs/

  publish-report:
    needs: test
    if: ${{ !cancelled() && vars.PUBLISH_REPORT_TO_PAGES == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
